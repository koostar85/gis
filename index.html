<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    body {
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .leaflet-popup-content-wrapper {
      padding: 0;

</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex flex-col antialiased">

  <!-- Header Bar -->

      <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center w-8 h-8 font-bold">
        <i class="fa-solid fa-map-location-dot"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
          대한민국 공간정보 Web GIS
          <span class="text-xs font-normal text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full">v2.0</span>
        </h1>
      </div>
    </div>

    <!-- Search Box -->

      <input type="text" id="searchInput" placeholder="장소, 행정구역, 도로명 검색..." 
        class="w-full bg-slate-800 border border-slate-700 text-slate-200 placeholder-slate-400 text-xs rounded-full pl-9 pr-8 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
      <button id="clearSearch" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <!-- Auto Complete Dropdown -->
      <div id="searchResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden max-h-60 overflow-y-auto z-50"></div>
    </div>

    <div class="flex items-center gap-2 text-xs text-slate-400">
      <span class="hidden sm:inline"><i class="fa-regular fa-clock mr-1"></i>데이터 실시간 동기화</span>
    </div>
  </header>

  <!-- Main Map Area -->

    <!-- Leaflet Map Container -->
    <div id="map" class="w-full h-full z-0 bg-slate-950"></div>

          </button>
        </div>

        <div id="panelContent" class="p-3 overflow-y-auto space-y-4 max-h-[calc(100vh-12rem)]">

            <div class="flex items-center justify-between mb-2">
              <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-xs text-white">
                <input type="checkbox" id="layerTour" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-700 border-slate-600">
                <span class="flex items-center gap-1.5">
                  <i class="fa-solid fa-location-dot text-indigo-400"></i>
                  관광지 (포인트)
                </span>
              </label>
              <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded" id="tourCount">0건</span>
            </div>
            
            <!-- Dynamic Legend Display Only (No sub-filters) -->
            <div class="pl-6 pt-1 space-y-1.5 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block ring-2 ring-emerald-500/30"></span>
                <span>자연/여가/관광명소</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block ring-2 ring-amber-500/30"></span>
                <span>여행/행사/안내</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block ring-2 ring-indigo-500/30"></span>
                <span>역사/문화유산</span>
              </div>
            </div>
          </div>

          <!-- Layer 2: 행정구역 -->
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3">

              <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded" id="adminCount">0건</span>
            </div>
            
            <!-- Legend Display -->
            <div class="pl-6 pt-1 grid grid-cols-2 gap-1.5 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-blue-500/60 border border-blue-400 inline-block"></span>
                <span>서울특별시</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-teal-500/60 border border-teal-400 inline-block"></span>
                <span>경기도</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-indigo-500/60 border border-indigo-400 inline-block"></span>
                <span>강원특별자치도</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-amber-500/60 border border-amber-400 inline-block"></span>
                <span>충청북도</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-emerald-500/60 border border-emerald-400 inline-block"></span>
                <span>전라남도</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-2.5 rounded-sm bg-rose-500/60 border border-rose-400 inline-block"></span>
                <span>경상북도</span>
              </div>
            </div>
          </div>

          <!-- Layer 3: 주요 도로망 -->
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-xs text-white">
                <input type="checkbox" id="layerRoad" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-700 border-slate-600">
                <span class="flex items-center gap-1.5">
                  <i class="fa-solid fa-route text-amber-400"></i>
                  도로망 네트워크
                </span>
              </label>
              <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded" id="roadCount">0건</span>
            </div>
            
            <!-- Legend Display -->
            <div class="pl-6 pt-1 space-y-1.5 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="w-4 h-1 bg-red-500 rounded inline-block"></span>
                <span>고속도로 (Motorway)</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-4 h-0.5 bg-orange-400 inline-block"></span>
                <span>주요 국도 (Trunk)</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-4 h-0.5 bg-amber-300 inline-block border-t border-dashed border-slate-900"></span>
                <span>지방도/일반도로 (Primary)</span>
              </div>
            </div>
          </div>

          <!-- BaseMap Selector -->
          <div class="pt-2 border-t border-slate-800">
            <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-2">배경 지도 선택</label>
            <div class="grid grid-cols-2 gap-2">
              <button id="bmDark" class="px-2.5 py-1.5 text-xs rounded-lg bg-indigo-600 text-white font-medium transition flex items-center justify-center gap-1.5 shadow">
                <i class="fa-solid fa-moon"></i> 다크 모드
              </button>
              <button id="bmOsm" class="px-2.5 py-1.5 text-xs rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-sun"></i> 일반 표준
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- Map Quick Action Floating Buttons (Left Side) -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-2">
      <button id="btnZoomExtent" title="전체 영역으로 이동" class="w-9 h-9 bg-slate-900/90 text-slate-200 hover:text-white hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center shadow-lg transition backdrop-blur-md">
        <i class="fa-solid fa-compress"></i>
      </button>
      <button id="btnResetView" title="기본 위치 (서울) 이동" class="w-9 h-9 bg-slate-900/90 text-slate-200 hover:text-white hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center shadow-lg transition backdrop-blur-md">
        <i class="fa-solid fa-house"></i>
      </button>
    </div>

  </div>

      attribution: '&copy; OpenStreetMap contributors'

      map.removeLayer(osmTile);
      map.addLayer(darkTile);

        case '역사/문화유산': return '#6366f1';     // Indigo
        default: return '#94a3b8';
      }
    }

        case '서울특별시': return '#3b82f6';
        case '경기도': return '#14b8a6';
        case '강원특별자치도': return '#6366f1';
        case '충청북도': return '#f59e0b';
        case '전라남도': return '#10b981';
        case '경상북도': return '#f43f5e';
        default: return '#64748b';
      }
    }

    function getRoadStyle(fclass) {
      switch (fclass) {
        case 'motorway': return { color: '#ef4444', weight: 4.5, opacity: 0.9 }; // Red
        case 'trunk': return { color: '#fb923c', weight: 3, opacity: 0.85 };    // Orange
        case 'primary': return { color: '#fde047', weight: 2, opacity: 0.8, dashArray: '4,4' }; // Yellow
        default: return { color: '#cbd5e1', weight: 1.5, opacity: 0.7 };
      }
    }

    // --- 4. LAYER CREATION & POPUPS ---

    // Popup Generator
    function createCustomPopup(title, category, items) {
      let rows = items.map(item => `
        <tr class="border-b border-slate-100 last:border-none">
          <td class="py-1.5 text-slate-500 font-medium text-[11px] w-24">${item.label}</td>
          <td class="py-1.5 text-slate-800 text-[11px] font-medium">${item.value}</td>
        </tr>
      `).join('');

      return `
        <div class="bg-white text-slate-800 rounded-xl overflow-hidden shadow-xl border border-slate-100">
          <div class="bg-slate-900 text-white p-3">
            <span class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 block mb-0.5">${category}</span>
            <h3 class="text-sm font-bold leading-snug">${title}</h3>
          </div>
          <div class="p-3">
            <table class="w-full">
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 1. Admin Layer (Polygon)
    const adminLayer = L.geoJSON(adminData, {
      style: function(feature) {
        return {
          fillColor: getAdminColor(feature.properties.sido),
          fillOpacity: 0.15,
          weight: 1.5,
          color: getAdminColor(feature.properties.sido),
          dashArray: '3,3'
        };
      },
      onEachFeature: function(feature, layer) {
        layer.on('mouseover', function() {
          this.setStyle({ fillOpacity: 0.4, weight: 2.5 });
        });
        layer.on('mouseout', function() {
          adminLayer.resetStyle(this);
        });
        layer.bindPopup(createCustomPopup(feature.properties.sido, '행정구역 경계', [
          { label: '행정구역명', value: feature.properties.sido },
          { label: '지역 코드', value: feature.properties.code }
        ]));
      }
    }).addTo(map);

    // 2. Road Layer (LineString)
    const roadLayer = L.geoJSON(roadData, {
      style: function(feature) {
        return getRoadStyle(feature.properties.fclass);
      },
      onEachFeature: function(feature, layer) {
        const roadTypeKor = feature.properties.fclass === 'motorway' ? '고속도로' : 
                            feature.properties.fclass === 'trunk' ? '주요 국도' : '지방도/일반도로';
        layer.bindPopup(createCustomPopup(feature.properties.name, '도로 정보', [
          { label: '도로명', value: feature.properties.name },
          { label: '도로 유형', value: roadTypeKor }
        ]));
      }
    }).addTo(map);

    // 3. Tour Layer (Points)
    const tourLayer = L.geoJSON(tourdata, {
      pointToLayer: function(feature, latlng) {
        const color = getTourColor(feature.properties.mcate_cd_prefix3_nm);
        return L.circleMarker(latlng, {
          radius: 7,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });
      },
      onEachFeature: function(feature, layer) {
        layer.bindPopup(createCustomPopup(
          feature.properties.name,
          feature.properties.mcate_cd_prefix3_nm,
          [
            { label: '카테고리', value: feature.properties.mcate_cd_prefix3_nm },
            { label: '주소', value: feature.properties.addr },
            { label: '문의처', value: feature.properties.tel || '정보 없음' }
          ]
        ));
      }
    }).addTo(map);

    // --- 5. UI CONTROLS & COUNTS ---

    // Update Item Counts
    document.getElementById('tourCount').innerText = `${tourdata.features.length}건`;
    document.getElementById('adminCount').innerText = `${adminData.features.length}건`;
    document.getElementById('roadCount').innerText = `${roadData.features.length}건`;

    // Layer Toggle Events
    document.getElementById('layerTour').addEventListener('change', function(e) {
      if (e.target.checked) map.addLayer(tourLayer);
      else map.removeLayer(tourLayer);
    });

    document.getElementById('layerAdmin').addEventListener('change', function(e) {
      if (e.target.checked) map.addLayer(adminLayer);
      else map.removeLayer(adminLayer);
    });

    document.getElementById('layerRoad').addEventListener('change', function(e) {
      if (e.target.checked) map.addLayer(roadLayer);
      else map.removeLayer(roadLayer);
    });

    // Panel Collapse Toggle
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const panelContent = document.getElementById('panelContent');
    let isPanelOpen = true;

    togglePanelBtn.addEventListener('click', () => {
      isPanelOpen = !isPanelOpen;
      panelContent.classList.toggle('hidden', !isPanelOpen);
      togglePanelBtn.innerHTML = isPanelOpen ? '<i class="fa-solid fa-chevron-up"></i>' : '<i class="fa-solid fa-chevron-down"></i>';
    });

    // Navigation Buttons
    document.getElementById('btnZoomExtent').addEventListener('click', () => {
      const group = L.featureGroup([tourLayer, adminLayer, roadLayer]);
      map.fitBounds(group.getBounds(), { padding: [30, 30] });
    });

    document.getElementById('btnResetView').addEventListener('click', () => {
      map.setView([37.5665, 126.9780], 11);
    });

    // --- 6. SEARCH FUNCTIONALITY ---
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const clearSearch = document.getElementById('clearSearch');

    // Build Search Index
    const searchIndex = [];

    tourdata.features.forEach(f => {
      searchIndex.push({
        name: f.properties.name,
        type: '관광지',
        category: f.properties.mcate_cd_prefix3_nm,
        coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
        layer: tourLayer
      });
    });

    adminData.features.forEach(f => {
      // Polygon center approximation
      const coords = f.geometry.coordinates[0][0];
      searchIndex.push({
        name: f.properties.sido,
        type: '행정구역',
        category: '시도 Boundary',
        coords: [coords[1], coords[0]],
        layer: adminLayer
      });
    });

    roadData.features.forEach(f => {
      const coords = f.geometry.coordinates[0];
      searchIndex.push({
        name: f.properties.name,
        type: '도로망',
        category: '주요 도로',
        coords: [coords[1], coords[0]],
        layer: roadLayer
      });
    });

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      
      if (!val) {
        searchResults.classList.add('hidden');
        clearSearch.classList.add('hidden');
        return;
      }

      clearSearch.classList.remove('hidden');
      const matches = searchIndex.filter(item => item.name.toLowerCase().includes(val));

      if (matches.length === 0) {
        searchResults.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">검색 결과가 없습니다.</div>`;
      } else {
        searchResults.innerHTML = matches.map((item, idx) => `
          <div data-idx="${idx}" class="search-item p-2.5 hover:bg-slate-700/80 cursor-pointer border-b border-slate-700/50 last:border-none flex items-center justify-between text-xs transition">
            <div>
              <span class="font-bold text-white block">${item.name}</span>
              <span class="text-[10px] text-slate-400">${item.category}</span>
            </div>
            <span class="text-[10px] bg-slate-900 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-900">${item.type}</span>
          </div>
        `).join('');

        // Item click handles
        document.querySelectorAll('.search-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = el.getAttribute('data-idx');
            const target = matches[idx];
            
            map.setView(target.coords, 14, { animate: true });
            searchResults.classList.add('hidden');
            searchInput.value = target.name;
          });
        });
      }

      searchResults.classList.remove('hidden');
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchResults.classList.add('hidden');
      clearSearch.classList.add('hidden');
    });

    // Close search dropdown on click outside
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

  </script>
</body>
</html>
