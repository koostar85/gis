<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 공간정보 Web GIS Service</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      background: #ffffff;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 280px !important;
    }
    .leaflet-popup-tip { background: #ffffff; }
  </style>
</head>
<body class="bg-slate-950 h-screen w-screen overflow-hidden flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 text-white h-14 flex items-center justify-between px-4 z-20 shrink-0 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center w-8 h-8 font-bold shadow-md shadow-indigo-600/30">
        <i class="fa-solid fa-map-location-dot"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base tracking-wide flex items-center gap-2">
          대한민국 공간정보 Web GIS
          <span class="text-[10px] font-normal text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full">GeoJSON 자동로드</span>
        </h1>
      </div>
    </div>

    <!-- Direct File Input (Backup Option) -->
    <div class="flex items-center gap-2">
      <label for="manualFileInput" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
        <i class="fa-solid fa-folder-open text-indigo-400"></i>
        <span class="hidden sm:inline">수동 수급 (선택)</span>
      </label>
      <input type="file" id="manualFileInput" multiple accept=".geojson,.json" class="hidden">
    </div>
  </header>

  <!-- Main Map Container -->
  <div class="relative flex-1 w-full h-full">
    <div id="map" class="w-full h-full z-0 bg-slate-950"></div>

    <!-- Status Toast Notification -->
    <div id="toast" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 border border-slate-700 text-white px-4 py-2 rounded-full text-xs shadow-2xl backdrop-blur-md flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none">
      <i id="toastIcon" class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
      <span id="toastMsg">GeoJSON 파일을 로드하는 중입니다...</span>
    </div>

    <!-- LEFT-TOP Panel & Integrated Legend -->
    <div class="absolute top-4 left-4 z-10 w-80 max-h-[calc(100vh-6rem)] flex flex-col gap-3">
      <div class="bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col text-slate-200">
        
        <!-- Header -->
        <div class="p-3.5 bg-slate-800/80 border-b border-slate-700/80 flex items-center justify-between">
          <div class="flex items-center gap-2 font-bold text-sm text-slate-100">
            <i class="fa-solid fa-layer-group text-indigo-400"></i>
            <span>레이어 및 범례</span>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnZoomExtent" title="전체 영역 맞춤" class="text-slate-400 hover:text-white text-xs transition">
              <i class="fa-solid fa-compress"></i>
            </button>
            <button id="togglePanelBtn" class="text-slate-400 hover:text-white text-xs transition">
              <i class="fa-solid fa-chevron-up"></i>
            </button>
          </div>
        </div>

        <div id="panelContent" class="p-3 overflow-y-auto space-y-3.5 max-h-[calc(100vh-10rem)]">
          
          <!-- Layer 1: admin.geojson (Top) -->
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-xs text-white">
                <input type="checkbox" id="layerAdmin" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-700 border-slate-600">
                <span class="flex items-center gap-1.5">
                  <i class="fa-solid fa-draw-polygon text-purple-400"></i>
                  행정구역 (admin)
                </span>
              </label>
              <span id="adminStatus" class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded">대기중</span>
            </div>
            
            <!-- Dynamic Sido Legend -->
            <div id="adminLegend" class="pl-6 pt-1 grid grid-cols-2 gap-1.5 text-xs text-slate-300">
              <div class="col-span-2 text-[11px] text-slate-500">sido 별 범례 수집 중...</div>
            </div>
          </div>

          <!-- Layer 2: road.geojson -->
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-xs text-white">
                <input type="checkbox" id="layerRoad" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-700 border-slate-600">
                <span class="flex items-center gap-1.5">
                  <i class="fa-solid fa-route text-amber-400"></i>
                  도로망 (road)
                </span>
              </label>
              <span id="roadStatus" class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded">대기중</span>
            </div>
            
            <!-- Dynamic Fclass Legend -->
            <div id="roadLegend" class="pl-6 pt-1 space-y-1.5 text-xs text-slate-300">
              <div class="text-[11px] text-slate-500">fclass 별 범례 수집 중...</div>
            </div>
          </div>

          <!-- Layer 3: tourdata.geojson (Initially OFF) -->
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-xs text-white">
                <input type="checkbox" id="layerTour" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-700 border-slate-600">
                <span class="flex items-center gap-1.5">
                  <i class="fa-solid fa-location-dot text-indigo-400"></i>
                  관광지 (tourdata)
                </span>
              </label>
              <span id="tourStatus" class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded">대기중</span>
            </div>
            
            <div class="pl-6 pt-1 space-y-1 text-xs text-slate-400">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                <span>관광지 레이어 포인트</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // --- 1. INITIALIZE MAP & STANDARD OSM TILE ---
    const map = L.map('map', {
      center: [36.3, 127.8],
      zoom: 7,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Layer Storage
    let tourLayer = null;
    let adminLayer = null;
    let roadLayer = null;

    // Preset Color Palettes
    const sidoColorMap = {};
    const sidoColors = [
      '#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', 
      '#06b6d4', '#6366f1', '#14b8a6', '#f43f5e', '#a855f7'
    ];

    const fclassColorMap = {
      'motorway': { color: '#ef4444', name: '고속도로 (motorway)', weight: 3 },
      'trunk': { color: '#f97316', name: '주요간선 (trunk)', weight: 2.5 },
      'primary': { color: '#f59e0b', name: '1차선/기본도로 (primary)', weight: 2 },
      'secondary': { color: '#eab308', name: '2차선도로 (secondary)', weight: 1.5 },
      'tertiary': { color: '#84cc16', name: '소로 (tertiary)', weight: 1.5 },
      'residential': { color: '#94a3b8', name: '주거지도로 (residential)', weight: 1 }
    };

    function getSidoColor(sido) {
      if (!sido) return '#8b5cf6';
      if (!sidoColorMap[sido]) {
        const index = Object.keys(sidoColorMap).length % sidoColors.length;
        sidoColorMap[sido] = sidoColors[index];
      }
      return sidoColorMap[sido];
    }

    function getRoadStyle(fclass) {
      const conf = fclassColorMap[fclass] || { color: '#64748b', weight: 1.5 };
      return {
        color: conf.color,
        weight: conf.weight,
        opacity: 0.85
      };
    }

    // Toast Notification Helper
    function showToast(msg, iconClass = "fa-circle-notch fa-spin", autoHide = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${iconClass} text-indigo-400`;
      toast.classList.remove('opacity-0', 'pointer-events-none');

      if (autoHide) {
        setTimeout(() => {
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
      }
    }

    // Popup Generator
    function createPopupContent(properties, layerTitle) {
      let rows = '';
      for (const [key, val] of Object.entries(properties)) {
        if (typeof val !== 'object') {
          rows += `
            <tr class="border-b border-slate-100 last:border-none">
              <td class="py-1 px-2 text-slate-500 font-semibold text-[11px] bg-slate-50 w-28 break-all">${key}</td>
              <td class="py-1 px-2 text-slate-800 text-[11px] font-normal break-all">${val !== null ? val : '-'}</td>
            </tr>
          `;
        }
      }

      const title = properties.sido || properties.fclass || properties.name || properties.title || layerTitle;

      return `
        <div class="bg-white text-slate-800 rounded-xl overflow-hidden shadow-xl">
          <div class="bg-slate-900 text-white px-3 py-2 border-b border-slate-800">
            <span class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 block">${layerTitle}</span>
            <h3 class="text-xs font-bold leading-tight truncate">${title}</h3>
          </div>
          <div class="max-h-48 overflow-y-auto">
            <table class="w-full text-left border-collapse">${rows}</table>
          </div>
        </div>
      `;
    }

    // --- 2. LOAD GEOJSON FILES ---

    // Load Admin GeoJSON with Sido Styles
    async function loadAdminData(data) {
      if (adminLayer) map.removeLayer(adminLayer);
      
      const sidoSet = new Set();

      adminLayer = L.geoJSON(data, {
        style: (feature) => {
          const sido = feature.properties?.sido || feature.properties?.CTP_KOR_NM || feature.properties?.NAME || '기타';
          sidoSet.add(sido);
          const color = getSidoColor(sido);
          return {
            fillColor: color,
            fillOpacity: 0.25,
            color: color,
            weight: 1.5,
            dashArray: '2,2'
          };
        },
        onEachFeature: (feature, layer) => {
          layer.on('mouseover', function() { this.setStyle({ fillOpacity: 0.5, weight: 2.5 }); });
          layer.on('mouseout', function() { adminLayer.resetStyle(this); });
          layer.bindPopup(createPopupContent(feature.properties, '행정구역 (admin)'));
        }
      });

      if (document.getElementById('layerAdmin').checked) {
        adminLayer.addTo(map);
      }

      // Render Admin Legend
      const legendContainer = document.getElementById('adminLegend');
      legendContainer.innerHTML = '';
      if (sidoSet.size === 0) sidoSet.add('기타');
      
      sidoSet.forEach(sido => {
        const color = getSidoColor(sido);
        const item = document.createElement('div');
        item.className = 'flex items-center gap-1.5 truncate';
        item.innerHTML = `
          <span class="w-3 h-2.5 rounded shrink-0 border" style="background-color: ${color}40; border-color: ${color}"></span>
          <span class="truncate" title="${sido}">${sido}</span>
        `;
        legendContainer.appendChild(item);
      });

      const count = data.features ? data.features.length : 1;
      document.getElementById('adminStatus').innerText = `${count}개`;
      document.getElementById('adminStatus').className = "text-[10px] text-emerald-400 font-mono bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800";
    }

    // Load Road GeoJSON with Fclass Styles
    async function loadRoadData(data) {
      if (roadLayer) map.removeLayer(roadLayer);

      const fclassSet = new Set();

      roadLayer = L.geoJSON(data, {
        style: (feature) => {
          const fclass = feature.properties?.fclass || '기타';
          fclassSet.add(fclass);
          return getRoadStyle(fclass);
        },
        onEachFeature: (feature, layer) => {
          layer.bindPopup(createPopupContent(feature.properties, '도로망 (road)'));
        }
      });

      if (document.getElementById('layerRoad').checked) {
        roadLayer.addTo(map);
      }

      // Render Road Legend
      const legendContainer = document.getElementById('roadLegend');
      legendContainer.innerHTML = '';
      if (fclassSet.size === 0) fclassSet.add('기타');

      fclassSet.forEach(fclass => {
        const style = getRoadStyle(fclass);
        const name = fclassColorMap[fclass]?.name || fclass;
        const item = document.createElement('div');
        item.className = 'flex items-center gap-2 truncate';
        item.innerHTML = `
          <span class="w-4 h-1 rounded shrink-0" style="background-color: ${style.color}"></span>
          <span class="truncate" title="${name}">${name}</span>
        `;
        legendContainer.appendChild(item);
      });

      const count = data.features ? data.features.length : 1;
      document.getElementById('roadStatus').innerText = `${count}개`;
      document.getElementById('roadStatus').className = "text-[10px] text-emerald-400 font-mono bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800";
    }

    // Load Tour GeoJSON (Initial State: OFF)
    async function loadTourData(data) {
      if (tourLayer) map.removeLayer(tourLayer);

      tourLayer = L.geoJSON(data, {
        pointToLayer: (feature, latlng) => {
          return L.circleMarker(latlng, {
            radius: 5,
            fillColor: '#10b981',
            color: '#ffffff',
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.85
          });
        },
        onEachFeature: (feature, layer) => {
          layer.bindPopup(createPopupContent(feature.properties, '관광지 (tourdata)'));
        }
      });

      // Initially OFF according to user request
      if (document.getElementById('layerTour').checked) {
        tourLayer.addTo(map);
      }

      const count = data.features ? data.features.length : 1;
      document.getElementById('tourStatus').innerText = `${count}개 (OFF)`;
      document.getElementById('tourStatus').className = "text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700";
    }

    // Fit map bounds automatically to active layers
    function fitAllExtent() {
      const activeLayers = [];
      if (document.getElementById('layerAdmin').checked && adminLayer) activeLayers.push(adminLayer);
      if (document.getElementById('layerRoad').checked && roadLayer) activeLayers.push(roadLayer);
      if (document.getElementById('layerTour').checked && tourLayer) activeLayers.push(tourLayer);

      const group = L.featureGroup(activeLayers);
      if (group.getLayers().length > 0) {
        map.fitBounds(group.getBounds(), { padding: [30, 30] });
      }
    }

    // Auto-fetch the 3 GeoJSON files from local directory
    async function autoFetchGeoJSONFiles() {
      showToast("동일 경로의 GeoJSON 파일 읽는 중...", "fa-spin fa-circle-notch");
      
      let loadedCount = 0;

      // 1. Fetch admin.geojson
      try {
        const res = await fetch('./admin.geojson');
        if (res.ok) {
          const data = await res.json();
          await loadAdminData(data);
          loadedCount++;
        } else { throw new Error(); }
      } catch (e) {
        document.getElementById('adminStatus').innerText = "파일 없음";
        document.getElementById('adminStatus').className = "text-[10px] text-rose-400 font-mono bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-800";
      }

      // 2. Fetch road.geojson
      try {
        const res = await fetch('./road.geojson');
        if (res.ok) {
          const data = await res.json();
          await loadRoadData(data);
          loadedCount++;
        } else { throw new Error(); }
      } catch (e) {
        document.getElementById('roadStatus').innerText = "파일 없음";
        document.getElementById('roadStatus').className = "text-[10px] text-rose-400 font-mono bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-800";
      }

      // 3. Fetch tourdata.geojson
      try {
        const res = await fetch('./tourdata.geojson');
        if (res.ok) {
          const data = await res.json();
          await loadTourData(data);
          loadedCount++;
        } else { throw new Error(); }
      } catch (e) {
        document.getElementById('tourStatus').innerText = "파일 없음";
        document.getElementById('tourStatus').className = "text-[10px] text-rose-400 font-mono bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-800";
      }

      if (loadedCount > 0) {
        fitAllExtent();
        showToast("GeoJSON 로드 완료!", "fa-check text-emerald-400", true);
      } else {
        showToast("파일 자동 로드 실패. [수동 수급] 버튼을 사용하세요.", "fa-triangle-exclamation text-amber-400", true);
      }
    }

    // Manual Local File Picker Fallback
    document.getElementById('manualFileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const data = JSON.parse(event.target.result);
            const fname = file.name.toLowerCase();

            if (fname.includes('admin')) loadAdminData(data);
            else if (fname.includes('road')) loadRoadData(data);
            else if (fname.includes('tour')) loadTourData(data);
            else loadTourData(data);

            fitAllExtent();
            showToast(`${file.name} 수동 로드 완료`, "fa-check text-emerald-400", true);
          } catch (err) {
            alert(`올바르지 않은 GeoJSON 파일 형태입니다: ${file.name}`);
          }
        };
        reader.readAsText(file);
      });
    });

    // --- 3. UI EVENT LISTENERS ---
    document.getElementById('layerAdmin').addEventListener('change', e => {
      if (!adminLayer) return;
      if (e.target.checked) map.addLayer(adminLayer);
      else map.removeLayer(adminLayer);
    });

    document.getElementById('layerRoad').addEventListener('change', e => {
      if (!roadLayer) return;
      if (e.target.checked) map.addLayer(roadLayer);
      else map.removeLayer(roadLayer);
    });

    document.getElementById('layerTour').addEventListener('change', e => {
      if (!tourLayer) return;
      if (e.target.checked) {
        map.addLayer(tourLayer);
        document.getElementById('tourStatus').innerText = `${tourLayer.getLayers().length}개`;
        document.getElementById('tourStatus').className = "text-[10px] text-emerald-400 font-mono bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800";
      } else {
        map.removeLayer(tourLayer);
        document.getElementById('tourStatus').innerText = `${tourLayer.getLayers().length}개 (OFF)`;
        document.getElementById('tourStatus').className = "text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700";
      }
    });

    document.getElementById('btnZoomExtent').addEventListener('click', fitAllExtent);

    // Panel Toggle
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const panelContent = document.getElementById('panelContent');
    let isPanelOpen = true;

    togglePanelBtn.addEventListener('click', () => {
      isPanelOpen = !isPanelOpen;
      panelContent.classList.toggle('hidden', !isPanelOpen);
      togglePanelBtn.innerHTML = isPanelOpen ? '<i class="fa-solid fa-chevron-up"></i>' : '<i class="fa-solid fa-chevron-down"></i>';
    });

    // Start Auto Loading on Page Load
    window.addEventListener('DOMContentLoaded', autoFetchGeoJSONFiles);

  </script>
</body>
</html>
